name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build Windows executable from tagged source
        shell: pwsh
        run: |
          ./scripts/build-python.ps1 -Python python -WorkRoot "$env:RUNNER_TEMP\pyinstaller"
          ./dist/NeonArrowNexus-Python.exe --headless-check

      - name: Package and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "neon-arrow-release"
          $packageJson = & ./scripts/package-release.ps1 `
            -Version $env:RELEASE_TAG `
            -OutputRoot $outputRoot
          $package = $packageJson | ConvertFrom-Json

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          Windows x64 coursework release of Neon Arrow Nexus.

          Download the ZIP below, extract it completely, then double-click the BAT launcher or run `dist/NeonArrowNexus-Python.exe` directly. Python is not required.

          SHA-256: $($package.Sha256)
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8

          gh release create $env:RELEASE_TAG $package.Zip `
            --repo $env:GITHUB_REPOSITORY `
            --title "Neon Arrow Nexus $env:RELEASE_TAG" `
            --notes-file $notesPath
